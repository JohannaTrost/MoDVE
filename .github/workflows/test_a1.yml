name: Test A1 R script

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  test-a1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Install R packages
        run: |
          Rscript -e 'install.packages("optparse", repos="http://cran.uk.r-project.org")'
          Rscript -e 'install.packages("configr", repos="http://cran.uk.r-project.org")'

      - name: Run A1 script
        run: |
          cd ${{ github.workspace }}
          cd R/
          Rscript A1.R -i tests/config_a1.toml

      - name: Test A1 output
        run: |
          cd ${{ github.workspace }}
          cd R/
          Rscript tests/test_a1.R
